<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../css/cs.css">
  <title>Biodiversity Quiz</title>


</head>

<body>
  <div class="quiz-box">
    <h1>Biodiversity Quiz</h1>

    <div class="question">
      <p>1. What does biodiversity mean?</p>
      <label><input type="radio" name="q1" value="a"> The variety of life on Earth</label>
      <label><input type="radio" name="q1" value="b"> The number of people in a city</label>
      <label><input type="radio" name="q1" value="c"> The size of a forest</label>
    </div>

    <div class="question">
      <p>2. Which of these is a major threat to wildlife?</p>
      <label><input type="radio" name="q2" value="a"> Planting more trees</label>
      <label><input type="radio" name="q2" value="b"> Habitat destruction</label>
      <label><input type="radio" name="q2" value="c"> Protected parks</label>
    </div>

    <div class="question">
      <p>3. Which SDG is about "Life on Land"?</p>
      <label><input type="radio" name="q3" value="a"> SDG 15</label>
      <label><input type="radio" name="q3" value="b"> SDG 1</label>
      <label><input type="radio" name="q3" value="c"> SDG 7</label>
    </div>

    <button onclick="checkAnswers()">Submit</button>
    <p id="result"></p>
  </div>

  
    // The correct answer for each question
    <script src="../js/js.js"></script>
 
</body>
</html>
